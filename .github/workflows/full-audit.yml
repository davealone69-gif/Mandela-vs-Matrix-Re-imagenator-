name: Full Repository Audit

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  audit:
    name: Whole repository audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up supported Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Restore and validate Gradle wrapper JAR
        if: ${{ hashFiles('gradlew') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/gradle/wrapper
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar
          python3 - <<'PY'
          import zipfile
          path = "android/gradle/wrapper/gradle-wrapper.jar"
          with zipfile.ZipFile(path) as jar:
              if "META-INF/MANIFEST.MF" not in jar.namelist():
                  raise SystemExit("Invalid Gradle wrapper JAR: manifest missing")
          print("Gradle wrapper JAR is valid")
          PY

      - name: Gradle audit and build
        if: ${{ hashFiles('gradlew') != '' }}
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew android/gradlew
          ./gradlew lint test assembleDebug --continue --stacktrace --console=plain

      - name: Node audit and test
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts
          npm audit --audit-level=high || true
          if npm run | grep -qE '^  (test|lint|build)'; then
            npm run test --if-present
            npm run lint --if-present
            npm run build --if-present
          fi

      - name: Python syntax audit
        if: ${{ hashFiles('**/*.py') != '' }}
        shell: bash
        run: |
          python -m compileall -q .

      - name: CodeQL security analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript,python

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3
