name: android-unified-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest

    env:
      ANDROID_DIR: android
      NODE_VERSION: '22'
      JAVA_VERSION: '17'

    steps:
      # Checkout with write permissions
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Node 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # Install JS deps
      - name: Install dependencies
        run: npm ci

      # Capacitor sync
      - name: Sync Capacitor
        run: npx cap sync android

      # Prepare keystore directory
      - name: Prepare keystore directory
        run: mkdir -p ${{ env.ANDROID_DIR }}/app

      # Decode keystore
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ env.ANDROID_DIR }}/app/keystore.jks

      # Inject signing config
      - name: Inject signing config
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          cat >> gradle.properties <<EOF
          MYAPP_STORE_FILE=app/keystore.jks
          MYAPP_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # Build signed release
      - name: Build signed release
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew assembleRelease

      # Upload signed APK
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/*.apk

      # Read current version
      - name: Read current version
        id: readver
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Bump semantic version (patch)
      - name: Bump version
        id: bumpver
        run: |
          OLD=${{ steps.readver.outputs.version }}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD"
          NEW="$MAJOR.$MINOR.$((PATCH+1))"
          jq ".version = \"$NEW\"" package.json > package.tmp.json
          mv package.tmp.json package.json
          echo "new_version=$NEW" >> $GITHUB_OUTPUT

      # Bump Android versionCode
      - name: Bump Android versionCode
        run: |
          FILE="${{ env.ANDROID_DIR }}/app/build.gradle"
          CODE=$(grep versionCode $FILE | awk '{print $2}')
          NEWCODE=$((CODE+1))
          sed -i "s/versionCode $CODE/versionCode $NEWCODE/" $FILE

      # Commit version bump
      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json ${{ env.ANDROID_DIR }}/app/build.gradle
          git commit -m "ci: bump version to ${{ steps.bumpver.outputs.new_version }}"

      # Create tag
      - name: Create tag
        run: |
          TAG="v${{ steps.bumpver.outputs.new_version }}"
          git tag "$TAG"
          git push origin "$TAG"

      # Push changes
      - name: Push changes
        run: git push/keystore.jks

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact***
