name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure keystore dir exists
        run: mkdir -p app

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using KEYSTORE_BASE64 environment secret..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > app/keystore.jks
          elif [ -f "keystore.txt" ]; then
            echo "KEYSTORE_BASE64 secret not set; decoding bundled keystore.txt..."
            cat keystore.txt | tr -d '\r\n' | base64 -d > app/keystore.jks
          elif [ -f "release.keystore" ]; then
            echo "KEYSTORE_BASE64 secret not set; copying bundled release.keystore..."
            cp release.keystore app/keystore.jks
          else
            echo "Generating fallback keystore..."
            keytool -genkey -v -keystore app/keystore.jks -alias mandela_prod_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass mandela_prod_pass -keypass mandela_prod_pass -dname "CN=DriveLog, OU=Engineering, O=DriveLog, L=San Francisco, ST=CA, C=US"
          fi
          cp app/keystore.jks android/app/keystore.jks 2>/dev/null || true
          chmod 600 app/keystore.jks
          ls -lh app/keystore.jks

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if command -v keytool >/dev/null 2>&1; then
            keytool -list -v -keystore app/keystore.jks -storepass "$KEYSTORE_PASSWORD" || true
          else
            echo "keytool not available on runner; skipping keystore verification"
          fi

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
