name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # -------------------------------------------------------
      # Keystore – use secret if present, otherwise generate a
      # temporary debug keystore so the build never fails here.
      # -------------------------------------------------------
      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p android/app

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > android/app/keystore.jks
          else
            echo "No KEYSTORE_BASE64 secret found – generating temporary keystore..."
            keytool -genkeypair \
              -v \
              -keystore android/app/keystore.jks \
              -alias mandela \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Mandela, OU=Dev, O=Mandela, L=City, ST=State, C=US"
          fi

          ls -lh android/app/keystore.jks
          echo "Keystore ready."

      # -------------------------------------------------------
      # The committed gradle-wrapper.jar is frequently corrupt
      # when checked out on CI. Always replace it with the
      # official clean JAR for the exact Gradle version used.
      # -------------------------------------------------------
      - name: Restore clean Gradle Wrapper JAR
        run: |
          set -e
          mkdir -p android/gradle/wrapper

          echo "Downloading official gradle-wrapper.jar (Gradle 8.14.3)..."
          curl -fsSL \
            -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar"

          # Validate it is a real JAR
          python3 - <<'EOF'
          import os, zipfile, sys
          path = "android/gradle/wrapper/gradle-wrapper.jar"
          size = os.path.getsize(path)
          print(f"Size: {size} bytes")
          if size < 20000:
              print("ERROR: JAR too small")
              sys.exit(1)
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              if "META-INF/MANIFEST.MF" not in names:
                  print("ERROR: Not a valid JAR")
                  sys.exit(1)
          print("gradle-wrapper.jar is valid")
          EOF

          chmod +x android/gradlew
          ls -lh android/gradle/wrapper/gradle-wrapper.jar

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: find-apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            find android/app/build -type f || true
            exit 1
          fi
          echo "Found APK: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 14
