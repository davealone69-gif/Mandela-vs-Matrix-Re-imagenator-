name: Deep Repair Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply deep repair patches
        run: node scripts/repair_all.cjs

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "deep-repair-bot"
          git config user.email "deep-repair@users.noreply.github.com"
          git add -A
          git commit -m "deep-repair-all: applied server.ts App.tsx Cyber dashboard patches"
          git push
