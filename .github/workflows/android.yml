name: Android APK Build

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare keystore directory
        run: mkdir -p android/app

      - name: Create keystore (if no secret provided)
        run: |
          generate_temp_keystore() {
            echo "Generating temporary keystore..."
            keytool -genkey -v -keystore android/app/keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias mandela \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=Mandela Matrix,O=Matrix,L=Neo,S=Zion,C=US"
          }
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "No keystore secret found. Generating temporary keystore..."
            generate_temp_keystore
          elif echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks 2>/dev/null; then
            echo "Keystore decoded successfully from secret."
          else
            echo "Warning: ANDROID_KEYSTORE_BASE64 secret contains invalid base64. Generating temporary keystore..."
            generate_temp_keystore
          fi

      - name: Inject signing config
        working-directory: android
        run: |
          cat >> gradle.properties <<EOF
          MYAPP_RELEASE_STORE_FILE=app/keystore.jks
          MYAPP_RELEASE_STORE_PASSWORD=123456
          MYAPP_RELEASE_KEY_ALIAS=mandela
          MYAPP_RELEASE_KEY_PASSWORD=123456
          EOF

      - name: Fix gradlew permissions
        working-directory: android
        run: chmod +x gradlew

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Mandela-Matrix-Re-Imagenator-APK
          path: android/app/build/outputs/apk/release/*.apk
