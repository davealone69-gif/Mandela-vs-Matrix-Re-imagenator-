versioning:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout (with write permissions)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read current version
        id: readver
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Bump version (patch)
        id: bumpver
        run: |
          OLD=${{ steps.readver.outputs.version }}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD"
          NEW="$MAJOR.$MINOR.$((PATCH+1))"
          jq ".version = \"$NEW\"" package.json > package.tmp.json
          mv package.tmp.json package.json
          echo "new_version=$NEW" >> $GITHUB_OUTPUT

      - name: Bump Android versionCode
        run: |
          FILE="android/app/build.gradle"
          CODE=$(grep versionCode $FILE | awk '{print $2}')
          NEWCODE=$((CODE+1))
          sed -i "s/versionCode $CODE/versionCode $NEWCODE/" $FILE

      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json android/app/build.gradle
          git commit -m "ci: bump version to ${{ steps.bumpver.outputs.new_version }}"

      - name: Create tag
        run: |
          TAG="v${{ steps.bumpver.outputs.new_version }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Push changes
        run: git pushname: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      # Adjust to your app
      ANDROID_PROJECT_DIR: android
      NODE_VERSION: '22'
      JAVA_VERSION: '17'

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js for Capacitor
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 3. Java / Android toolchain
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      # 4. Install JS deps
      - name: Install npm dependencies
        run: npm ci

      # 5. Sync Capacitor
      - name: Sync Capacitor (Android)
        run: npx cap sync android

      # 6. Gradle build (unsigned release)
      - name: Build Android release
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: ./gradlew assembleRelease

      # 7. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk

  # OPTIONAL: signed release build (enable when you add secrets)
  signed-release:
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main'

    env:
      ANDROID_PROJECT_DIR: android
      NODE_VERSION: '22'
      JAVA_VERSION: '17'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      # Decode keystore from secret (BASE64)
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Configure signing
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          cat >> gradle.properties <<EOF
          MYAPP_STORE_FILE=../release.keystore
          MYAPP_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed release
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: ./gradlew assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-release-apk
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/release/*.apkname: Android APK Build

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 -d > app/keystore.jks

      - name: Build and sign APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Mandela-Matrix-Re-Imagenator-APK
          path: app/build/outputs/apk/release/*.apk
