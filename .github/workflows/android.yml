name: Android APK Build

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && \
             echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks 2>/dev/null; then
            echo "Using keystore from secret"
            echo "KEYSTORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore android/app/keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias mandela \
              -storepass temporarypass \
              -keypass temporarypass \
              -dname "CN=Mandela Matrix,O=Matrix,L=Neo,S=Zion,C=US"
            echo "KEYSTORE_PASS=temporarypass" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=mandela" >> "$GITHUB_ENV"
            echo "KEY_PASS=temporarypass" >> "$GITHUB_ENV"
          fi

      - name: Inject signing config
        working-directory: android
        run: |
          cat >> gradle.properties <<EOF
          MYAPP_RELEASE_STORE_FILE=app/keystore.jks
          MYAPP_RELEASE_STORE_PASSWORD=${{ env.KEYSTORE_PASS }}
          MYAPP_RELEASE_KEY_ALIAS=${{ env.KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD=${{ env.KEY_PASS }}
          EOF

      - name: Fix gradlew permissions
        working-directory: android
        run: chmod +x gradlew

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Mandela-Matrix-Re-Imagenator-APK
          path: android/app/build/outputs/apk/release/*.apk
