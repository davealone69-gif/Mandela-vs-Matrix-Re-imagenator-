name: android-dual

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_DIR: android
      NODE_VERSION: '22'
      JAVA_VERSION: '17'
      HAS_ANDROID_SIGNING_SECRETS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install NPM dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android --no-interactive

      - name: Install Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0
          cmdline-tools-version: 12.0

      - name: Clean Gradle caches
        run: rm -rf ~/.gradle/caches

      - name: Ensure Gradle wrapper is executable
        working-directory: ${{ env.ANDROID_DIR }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew --no-daemon --stacktrace --info assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk

      - name: Prepare keystore directory
        if: env.HAS_ANDROID_SIGNING_SECRETS == 'true'
        run: mkdir -p ${{ env.ANDROID_DIR }}/app

      - name: Decode Android keystore
        if: env.HAS_ANDROID_SIGNING_SECRETS == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ env.ANDROID_DIR }}/app/keystore.jks

      - name: Inject signing configuration
        if: env.HAS_ANDROID_SIGNING_SECRETS == 'true'
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python <<'PY'
          import os
          from pathlib import Path

          path = Path("gradle.properties")
