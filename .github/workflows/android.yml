name: Android APK Build

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_DIR: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify SDK tools
        run: sdkmanager --list || echo "SDK OK"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare keystore directory
        run: mkdir -p android/app

      - name: Create keystore (if no secret provided)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          DECODED=false
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            NORMALIZED_KEYSTORE="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
            if printf '%s' "$NORMALIZED_KEYSTORE" | base64 --decode > android/app/keystore.jks 2>/dev/null; then
              DECODED=true
            elif printf '%s' "$NORMALIZED_KEYSTORE" | tr '_-' '/+' | base64 --decode > android/app/keystore.jks 2>/dev/null; then
              DECODED=true
            fi
          fi

          if [ "$DECODED" = true ]; then
            echo "Decoded keystore from secret."
          else
            echo "No valid keystore secret found. Generating temporary keystore..."
            rm -f android/app/keystore.jks
            keytool -genkey -v -keystore android/app/keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias mandela \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=Mandela Matrix,O=Matrix,L=Neo,S=Zion,C=US"
          fi

      - name: Inject signing config
        working-directory: android
        run: |
          cat >> gradle.properties <<EOF
          MYAPP_RELEASE_STORE_FILE=app/keystore.jks
          MYAPP_RELEASE_STORE_PASSWORD=123456
          MYAPP_RELEASE_KEY_ALIAS=mandela
          MYAPP_RELEASE_KEY_PASSWORD=123456
          EOF

      - name: Fix gradlew permissions
        working-directory: ${{ env.ANDROID_DIR }}
        run: chmod +x gradlew

      - name: Test Google Maven DNS
        run: |
          ping -c 3 dl.google.com || echo "DNS FAIL"

      - name: Build signed release
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Mandela-Matrix-Re-Imagenator-APK
          path: android/app/build/outputs/apk/release/*.apk
