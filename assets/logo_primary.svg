<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810" />
      <stop offset="100%" stop-color="#0e1324" />
    </linearGradient>

    <!-- Logo Icon Linear Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Matrix Glow Filter -->
    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="100%" height="100%" rx="12" fill="url(#bgGrad)" stroke="#1a233d" stroke-width="1.5" />

  <g transform="translate(20, 15)">
    <!-- Standalone Emblem: Shifting Infinity/Grid Loop -->
    <g transform="translate(0, 0)">
      <!-- Left Reality Loop -->
      <path d="M 35 50 C 10 25, 10 75, 35 50 Z" fill="none" stroke="url(#logoGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#matrixGlow)" />
      <!-- Right Reality Loop -->
      <path d="M 35 50 C 60 25, 60 75, 35 50 Z" fill="none" stroke="url(#logoGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#matrixGlow)" />
      <!-- Middle Matrix Glitch Line -->
      <line x1="28" y1="50" x2="42" y2="50" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
      <line x1="30" y1="42" x2="33" y2="42" stroke="#10b981" stroke-width="2" />
      <line x1="37" y1="58" x2="40" y2="58" stroke="#8b5cf6" stroke-width="2" />
    </g>

    <!-- Typography: Title + Subtitle -->
    <g transform="translate(90, 0)">
      <!-- Primary Text -->
      <text x="0" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc" letter-spacing="1">
        MANDELA <tspan fill="url(#logoGrad)">vs</tspan> MATRIX
      </text>
      <!-- Subtitle/Slogan -->
      <text x="0" y="58" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#06b6d4" letter-spacing="3.5">
        RE-IMAGINATOR ENGINE
      </text>
    </g>
    
    <!-- Status Dot indicator -->
    <g transform="translate(470, 35)">
      <circle cx="0" cy="0" r="4" fill="#10b981" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4">
        <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="15" y="4" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#10b981" letter-spacing="1">LIVE</text>
    </g>
  </g>
</svg>
